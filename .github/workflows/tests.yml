# The website's tests on every push and pull request.
#   api     pytest: every HTTP route and the Live socket, stand-in embedder
#   site    typecheck, static build, Playwright against the built site
#   image   the Railway Docker image builds
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch, as in the Docker image)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - run: pytest -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install the server
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[web]"
      - name: Install the frontend
        working-directory: web/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: web/frontend
        run: npm run typecheck
      - name: Build the static site
        working-directory: web/frontend
        run: npm run build
      - name: Browser tests
        working-directory: web/frontend
        env:
          PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/frontend/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
