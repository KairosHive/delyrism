# Single-service Railway deployment.
# Build phase compiles the Next.js frontend into a static export
# (web/frontend/out/), then the runtime serves both API + static UI from one
# uvicorn process.  No second Railway service, no CORS, no env-var dance.

[phases.setup]
nixPkgs = ["python310", "nodejs_20", "libsndfile", "ffmpeg", "git"]

[phases.install]
cmds = [
    "python -m pip install --upgrade pip",
    # CPU-only torch wheels keep the image small for Railway's free/hobby tier
    "python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu",
    "python -m pip install -r requirements.txt",
    "python -m pip install -r web/backend/requirements.txt",
    "cd web/frontend && npm ci",
]

[phases.build]
cmds = [
    # Produces web/frontend/out/ which the FastAPI app mounts at /
    "cd web/frontend && npm run build",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir web/backend"
