# Railway frontend service — Next.js 14 (App Router).
# Point your frontend Railway service's "Nixpacks Config Path" at this file.
#
# Required at BUILD time (Next.js bakes NEXT_PUBLIC_* into the bundle):
#   NEXT_PUBLIC_API_BASE = https://<backend-service>.up.railway.app
#
# `npm ci` is used in install for deterministic builds; `npm start` honors $PORT.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd web/frontend && npm ci"]

[phases.build]
cmds = ["cd web/frontend && npm run build"]

[start]
cmd = "cd web/frontend && npm start -- --port $PORT --hostname 0.0.0.0"
